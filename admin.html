<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JITTEr Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ddd;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #00F0FF;
            text-align: center;
            margin-bottom: 40px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #0a0a0a;
            border: 1px solid #00F0FF;
            border-radius: 8px;
            padding: 20px;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 32px;
            color: #00F0FF;
            font-weight: bold;
        }
        .stat-unit {
            font-size: 14px;
            color: #666;
            margin-left: 5px;
        }
        .section {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            color: #00F0FF;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #111;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #00F0FF;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #222;
            font-size: 14px;
        }
        tr:hover {
            background: #111;
        }
        .badge-low { color: #00FF00; }
        .badge-medium { color: #FFD700; }
        .badge-high { color: #FF0055; }
        .btn {
            background: #00F0FF11;
            border: 1px solid #00F0FF;
            color: #00F0FF;
            padding: 12px 24px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 4px;
            margin-right: 10px;
        }
        .btn:hover {
            background: #00F0FF22;
        }
        .auth-status {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #111;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .auth-status.logged-in {
            border-color: #00F0FF;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ JITTEr Admin Dashboard</h1>

        <div class="auth-status" id="auth-status">
            <span id="auth-message">Loading...</span>
            <div style="margin-top:10px;">
                <button class="btn" id="btn-login" style="display:none;" onclick="promptLogin()">LOGIN</button>
                <button class="btn" id="btn-logout" style="display:none;" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <div id="dashboard" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="total-users">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Badges</div>
                    <div class="stat-value" id="total-badges">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Integrity</div>
                    <div class="stat-value" id="avg-integrity">-<span class="stat-unit">%</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Suspicion</div>
                    <div class="stat-value" id="avg-suspicion">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Bot Detection Rate</div>
                    <div class="stat-value" id="bot-rate">-<span class="stat-unit">%</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Bots Detected</div>
                    <div class="stat-value" id="bot-count">-</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Recent Badges</div>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Integrity</th>
                            <th>CR</th>
                            <th>Entropy</th>
                            <th>Keystrokes</th>
                            <th>Words</th>
                            <th>Level</th>
                            <th>Suspicion</th>
                            <th>Risk</th>
                        </tr>
                    </thead>
                    <tbody id="badges-table">
                        <tr>
                            <td colspan="9" class="loading">Loading badges...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="text-align:center; margin-top:20px;">
                <button class="btn" onclick="refreshStats()">REFRESH STATS</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>

    <script src="stats-utils.js"></script>

    <script>
        let auth = null;
        let currentUser = null;

        // Firebase config (same as auth-utils.js)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        async function init() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }

                auth = firebase.auth();

                // Initialize stats utils
                await StatsUtils.init();

                // Listen for auth state changes
                auth.onAuthStateChanged((user) => {
                    currentUser = user;
                    updateAuthUI();

                    if (user) {
                        // Load stats when logged in
                        loadStats();
                    }
                });
            } catch (error) {
                console.error('Init error:', error);
                document.getElementById('auth-message').innerText = 'Error initializing: ' + error.message;
            }
        }

        function updateAuthUI() {
            const authStatus = document.getElementById('auth-status');
            const authMessage = document.getElementById('auth-message');
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const dashboard = document.getElementById('dashboard');

            if (currentUser) {
                authStatus.classList.add('logged-in');
                authMessage.innerText = 'Logged in as: ' + currentUser.email;
                btnLogin.style.display = 'none';
                btnLogout.style.display = 'inline-block';
                dashboard.style.display = 'block';
            } else {
                authStatus.classList.remove('logged-in');
                authMessage.innerText = 'Admin login required to view dashboard';
                btnLogin.style.display = 'inline-block';
                btnLogout.style.display = 'none';
                dashboard.style.display = 'none';
            }
        }

        async function promptLogin() {
            const email = prompt('Admin Email:');
            const password = prompt('Password:');

            if (!email || !password) return;

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }

        async function logout() {
            try {
                await auth.signOut();
            } catch (error) {
                alert('Logout failed: ' + error.message);
            }
        }

        async function loadStats() {
            try {
                // Get global stats
                const stats = await StatsUtils.getGlobalStats();
                if (stats) {
                    document.getElementById('total-users').innerText = stats.totalUsers.toLocaleString();
                    document.getElementById('total-badges').innerText = stats.totalBadges.toLocaleString();
                    document.getElementById('avg-integrity').innerText = stats.avgIntegrity;
                    document.getElementById('avg-suspicion').innerText = stats.avgSuspicion;
                    document.getElementById('bot-rate').innerText = stats.botDetectionRate;
                    document.getElementById('bot-count').innerText = stats.botCount.toLocaleString();
                }

                // Get recent badges
                const badges = await StatsUtils.getRecentBadges(20);
                displayBadges(badges);
            } catch (error) {
                console.error('Load stats error:', error);
            }
        }

        function displayBadges(badges) {
            const tbody = document.getElementById('badges-table');

            if (badges.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#666;">No badges found</td></tr>';
                return;
            }

            tbody.innerHTML = badges.map(badge => {
                const time = badge.timestamp ? new Date(badge.timestamp.toDate()).toLocaleString() : 'N/A';
                const riskClass = badge.riskLevel === 'HIGH' ? 'badge-high' :
                                 badge.riskLevel === 'MEDIUM' ? 'badge-medium' : 'badge-low';

                return `
                    <tr>
                        <td>${time}</td>
                        <td>${badge.integrity || 0}%</td>
                        <td>${badge.cognitiveRatio || 0}</td>
                        <td>${badge.entropy || 0}</td>
                        <td>${(badge.keystrokes || 0).toLocaleString()}</td>
                        <td>${(badge.wordCount || 0).toLocaleString()}</td>
                        <td>${badge.passportLevel || 'N/A'}</td>
                        <td>${badge.suspicionScore || 0}</td>
                        <td class="${riskClass}">${badge.riskLevel || 'LOW'}</td>
                    </tr>
                `;
            }).join('');
        }

        async function refreshStats() {
            if (currentUser) {
                await loadStats();
            }
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
