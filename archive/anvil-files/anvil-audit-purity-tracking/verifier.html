<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvil - Certificate of Authenticity</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .certificate {
      max-width: 700px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .certificate-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .certificate-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255,255,255,0.05) 10px,
        rgba(255,255,255,0.05) 20px
      );
      animation: shimmer 20s linear infinite;
    }

    @keyframes shimmer {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50%, 50%); }
    }

    .certificate-logo {
      font-size: 64px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .certificate-title {
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .certificate-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      position: relative;
      z-index: 1;
    }

    .certificate-body {
      padding: 40px;
    }

    .purity-display {
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
      border-radius: 16px;
      margin-bottom: 32px;
      border: 3px solid #667eea;
    }

    .purity-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 12px;
    }

    .purity-value {
      font-size: 72px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .verification-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      color: #22c55e;
      font-weight: 600;
      font-size: 18px;
    }

    .checkmark {
      width: 32px;
      height: 32px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .metric {
      padding: 24px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .metric-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 700;
      color: #1f2937;
    }

    .metadata {
      background: #f9fafb;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e5e7eb;
    }

    .metadata-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .metadata-row:last-child {
      border-bottom: none;
    }

    .metadata-label {
      font-size: 14px;
      color: #6b7280;
      font-weight: 500;
    }

    .metadata-value {
      font-size: 14px;
      color: #1f2937;
      font-weight: 600;
    }

    .footer {
      padding: 24px 40px;
      background: #f9fafb;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }

    .footer-text {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.6;
    }

    .hash-display {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #666;
      word-break: break-all;
      border: 1px solid #e5e7eb;
    }

    .error-message {
      text-align: center;
      padding: 40px;
      color: #ef4444;
      font-size: 16px;
    }

    .assessment {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid;
      font-weight: 600;
      text-align: center;
    }

    .assessment.high {
      background: #f0fdf4;
      border-color: #22c55e;
      color: #166534;
    }

    .assessment.medium {
      background: #fffbeb;
      border-color: #f59e0b;
      color: #92400e;
    }

    .assessment.low {
      background: #fef2f2;
      border-color: #ef4444;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="certificate" id="certificate">
    <div class="certificate-header">
      <div class="certificate-logo">⚒️</div>
      <h1 class="certificate-title">CERTIFICATE OF AUTHENTICITY</h1>
      <p class="certificate-subtitle">Human Verification via Anvil</p>
    </div>

    <div class="certificate-body" id="certificateBody">
      <!-- Content will be injected by JavaScript -->
    </div>

    <div class="footer">
      <p class="footer-text">
        This certificate verifies the human authenticity of written content using biometric analysis,
        keystroke dynamics, and input source tracking. Generated by Anvil Human Verification System.
      </p>
      <div class="hash-display" id="hashDisplay"></div>
    </div>
  </div>

  <script src="verifier.js"></script>
</body>
</html>
