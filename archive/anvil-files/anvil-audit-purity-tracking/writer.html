<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvil Writer - Human Verified Writing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1a;
      color: #fff;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 320px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      box-shadow: 4px 0 20px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
    }

    .logo p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 5px;
    }

    .stat-box {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-value.purity {
      font-size: 48px;
      background: linear-gradient(90deg, #fff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-card {
      background: rgba(255,255,255,0.1);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.5);
    }

    .btn-danger.holding {
      background: rgba(239, 68, 68, 0.8);
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* EDITOR */
    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .editor-toolbar {
      background: #2a2a2a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3a3a3a;
    }

    .editor-title {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .word-count {
      color: #999;
      font-size: 13px;
    }

    .editor {
      flex: 1;
      padding: 60px;
      font-size: 18px;
      line-height: 1.8;
      color: #1a1a1a;
      outline: none;
      overflow-y: auto;
      font-family: 'Georgia', serif;
    }

    .editor:empty:before {
      content: 'Start typing to track your human input...';
      color: #999;
      font-style: italic;
    }

    /* ALERTS */
    .alert {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    .alert.robotic {
      background: rgba(239, 68, 68, 0.95);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* JITTER GRAPH */
    .jitter-graph {
      height: 60px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px;
      position: relative;
      overflow: hidden;
    }

    .jitter-bar {
      position: absolute;
      bottom: 8px;
      width: 3px;
      background: rgba(255,255,255,0.6);
      border-radius: 2px;
      transition: height 0.1s;
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <h1>⚒️ ANVIL</h1>
      <p>Human Verified Writing</p>
    </div>

    <div class="stat-box">
      <div class="stat-label">Purity Score</div>
      <div class="stat-value purity" id="purity">100%</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Human</div>
        <div class="metric-value" id="humanChars">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Alien</div>
        <div class="metric-value" id="alienChars">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Jitter (ms)</div>
        <div class="metric-value" id="jitter">0.00</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Words</div>
        <div class="metric-value" id="wordCount">0</div>
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">Keystroke Jitter Graph</div>
      <div class="jitter-graph" id="jitterGraph"></div>
    </div>

    <div class="controls">
      <button class="btn" id="generateBadgeBtn">Generate Smart Badge</button>
      <button class="btn" id="exportBtn">Export Text</button>
      <button class="btn btn-danger" id="resetBtn">Hold to Reset (2s)</button>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="editor-container">
    <div class="editor-toolbar">
      <div class="editor-title">📝 Untitled Document</div>
      <div class="word-count" id="toolbarWordCount">0 words</div>
    </div>
    <div class="editor" id="editor" contenteditable="true"></div>
  </div>

  <script src="writer.js"></script>
</body>
</html>
