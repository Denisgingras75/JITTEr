<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvil Writer | Verified Environment</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #111;
            color: #ddd;
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR (The Audit Log) */
        #sidebar {
            width: 250px;
            min-width: 250px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .stat-box {
            margin-bottom: 20px;
        }
        
        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .sub-value {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        
        #shield-icon {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
            transition: filter 0.3s ease;
        }
        
        .status-green {
            color: #00BA7C;
        }
        
        .status-red {
            color: #FF4444;
        }

        /* EDITOR (The Paper) */
        #editor-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            overflow-y: auto;
            padding: 50px 20px;
            background: #0d0d0d;
        }
        
        #editor {
            width: 100%;
            max-width: 800px;
            min-height: calc(100vh - 100px);
            outline: none;
            font-size: 18px;
            line-height: 1.8;
            color: #ccc;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        #editor:empty:before {
            content: "Start writing your verified draft...";
            color: #444;
            font-style: italic;
        }
        
        #editor:focus {
            outline: none;
        }

        /* ACTIONS */
        .btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        
        .btn:hover {
            background: #444;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: #00BA7C;
            color: #000;
        }
        
        .btn-primary:hover {
            background: #009e69;
        }

        /* Scrollbar styling */
        #editor-container::-webkit-scrollbar {
            width: 8px;
        }
        
        #editor-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        #editor-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        
        #editor-container::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <div style="text-align:center; margin-bottom:40px;">
                <span id="shield-icon">🛡️</span>
                <div id="status-text" class="status-green" style="font-weight:bold;">LIVE AUDIT</div>
            </div>

            <div class="stat-box">
                <div class="label">Purity Score</div>
                <div class="value" id="purity-display" style="color: #00BA7C;">100%</div>
                <div class="sub-value">Target: &gt;90%</div>
            </div>

            <div class="stat-box">
                <div class="label">Session Stats</div>
                <div class="sub-value">Typed: <span id="human-count" style="color:#fff; font-weight:600;">0</span></div>
                <div class="sub-value">Pasted: <span id="alien-count" style="color:#ff6b6b; font-weight:600;">0</span></div>
            </div>
            
            <div class="stat-box">
                <div class="label">Biometrics</div>
                <div class="sub-value">Jitter: <span id="jitter-display" style="color:#fff;">0.0000s</span></div>
            </div>
        </div>

        <div>
            <button class="btn btn-primary" id="btn-export">Export &amp; Sign</button>
            <button class="btn" id="btn-reset">Reset Session</button>
        </div>
    </div>

    <div id="editor-container">
        <div id="editor" contenteditable="true" spellcheck="true"></div>
    </div>

    <script src="writer.js"></script>
</body>
</html>
