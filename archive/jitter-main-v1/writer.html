<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitter Writer | Verified Environment</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ddd;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            width: 260px;
            background: #0a0a0a;
            border-right: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .stat-box { margin-bottom: 20px; padding: 15px; background: #111; border: 1px solid #222; border-radius: 6px; }
        .label { font-size: 10px; color: #666; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 24px; font-weight: 700; color: #fff; font-family: 'Courier New', monospace; }
        
        /* MAIN AREA */
        #main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: #080808;
            position: relative;
        }

        /* TOOLBAR */
        #toolbar {
            height: 50px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
        }
        .tool-btn {
            background: transparent; border: 1px solid transparent; color: #888;
            padding: 6px 10px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 14px; transition: all 0.2s;
        }
        .tool-btn:hover { background: #222; color: #fff; }
        
        .tool-select {
            background: #111; color: #ddd; border: 1px solid #333;
            padding: 5px; border-radius: 4px; font-size: 12px; cursor: pointer;
        }

        /* THE PAGE */
        #editor-container {
            flex-grow: 1; overflow-y: auto; padding: 40px;
            display: flex; justify-content: center;
        }
        #editor {
            width: 850px; min-height: 1000px;
            background: #111; border: 1px solid #222;
            padding: 60px 80px; outline: none;
            font-size: 18px; line-height: 1.6;
            color: #ddd; box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        #editor:focus { border-color: #333; }

        /* FONT CLASSES */
        .font-classic { font-family: 'Georgia', serif; }
        .font-modern  { font-family: 'Inter', system-ui, sans-serif; }
        .font-code    { font-family: 'Courier New', monospace; font-size: 16px !important; }

        /* SPACING CLASSES */
        .spacing-1    { line-height: 1.2 !important; }
        .spacing-15   { line-height: 1.6 !important; }
        .spacing-2    { line-height: 2.0 !important; }

        /* BUTTONS */
        .btn { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #222; border-color: #fff; }
        .btn-primary { background: #00F0FF11; border-color: #00F0FF; color: #00F0FF; }
        .btn-primary:hover { background: #00F0FF22; box-shadow: 0 0 15px #00F0FF44; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div style="margin-bottom:30px; display:flex; align-items:center; gap:10px;">
            <div style="font-size:24px;">⚡</div>
            <div>
                <div style="font-weight:800; color:#fff;">JITTER</div>
                <div style="font-size:10px; color:#666;">WRITER PRO</div>
            </div>
        </div>

        <div class="stat-box">
            <div class="label">Session Purity</div>
            <div class="value" id="purity-display" style="color: #00F0FF;">100%</div>
        </div>

        <div class="stat-box">
            <div class="label">Rhythm Entropy</div>
            <div class="value" id="entropy-display" style="color: #888;">100</div>
        </div>

        <div class="stat-box">
            <div class="label">Human Edits</div>
            <div class="value" id="edits-display" style="color: #FFD700;">0</div>
        </div>

        <div class="stat-box">
            <div class="label">Words</div>
            <div class="value" id="word-count">0</div>
        </div>

        <div class="stat-box" style="border-color:#FFD700;">
            <div class="label">Lifetime Passport</div>
            <div class="value" id="passport-display" style="color: #FFD700;">0</div>
            <div style="font-size:10px; color:#666; margin-top:5px;" id="passport-level">Novice</div>
        </div>

        <div style="margin-top:auto;">
            <button class="btn btn-primary" id="btn-export">MINT BADGE</button>
            <button class="btn" id="btn-reset">RESET</button>
        </div>
    </div>

    <div id="main">
        <div id="toolbar">
            <select class="tool-select" id="font-select">
                <option value="font-classic">Classic (Serif)</option>
                <option value="font-modern">Modern (Sans)</option>
                <option value="font-code">Code (Mono)</option>
            </select>
            <select class="tool-select" id="spacing-select">
                <option value="spacing-1">Single Space</option>
                <option value="spacing-15" selected>1.5 Space</option>
                <option value="spacing-2">Double Space</option>
            </select>
            <div style="width:1px; height:20px; background:#333; margin:0 5px;"></div>
            <button class="tool-btn" data-cmd="bold">B</button>
            <button class="tool-btn" data-cmd="italic">I</button>
            <button class="tool-btn" data-cmd="underline">U</button>
            <button class="tool-btn" data-cmd="formatBlock" data-val="H1">H1</button>
            <button class="tool-btn" data-cmd="formatBlock" data-val="H2">H2</button>
        </div>
        <div id="editor-container">
            <div id="editor" class="font-classic spacing-15" contenteditable="true" placeholder="Start typing..."></div>
        </div>
    </div>
    <script src="crypto-utils.js"></script>
    <script src="passport-utils.js"></script>
    <script src="writer.js"></script>
</body>
</html>
