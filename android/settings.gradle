pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // Repositories are declared here only; a build file declaring its own
    // would fail the build (RepositoriesMode.FAIL_ON_PROJECT_REPOS).
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "AnvilKeyboard"
include ':app'
