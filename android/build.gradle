// Top-level build file for Anvil Keyboard.
// Plugin versions live in settings.gradle (pluginManagement); repositories are
// declared there too, so nothing is configured per project here.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
