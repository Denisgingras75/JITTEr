<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitter Writer | Verified Environment</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ddd;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            width: 260px;
            background: #0a0a0a;
            border-right: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .stat-box { margin-bottom: 20px; padding: 15px; background: #111; border: 1px solid #222; border-radius: 6px; }
        .label { font-size: 10px; color: #666; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 24px; font-weight: 700; color: #fff; font-family: 'Courier New', monospace; }
        
        /* MAIN AREA */
        #main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: #080808;
            position: relative;
        }

        /* TOOLBAR */
        #toolbar {
            height: 50px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
        }
        .tool-btn {
            background: transparent; border: 1px solid transparent; color: #888;
            padding: 6px 10px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 14px; transition: all 0.2s;
        }
        .tool-btn:hover { background: #222; color: #fff; }
        
        .tool-select {
            background: #111; color: #ddd; border: 1px solid #333;
            padding: 5px; border-radius: 4px; font-size: 12px; cursor: pointer;
        }

        /* THE PAGE */
        #editor-container {
            flex-grow: 1; overflow-y: auto; padding: 40px;
            display: flex; justify-content: center;
        }
        #editor {
            width: 850px; min-height: 1000px;
            background: #111; border: 1px solid #222;
            padding: 60px 80px; outline: none;
            font-size: 18px; line-height: 1.6;
            color: #ddd; box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        #editor:focus { border-color: #333; }

        /* FONT CLASSES */
        .font-classic { font-family: 'Georgia', serif; }
        .font-modern  { font-family: 'Inter', system-ui, sans-serif; }
        .font-code    { font-family: 'Courier New', monospace; font-size: 16px !important; }

        /* SPACING CLASSES */
        .spacing-1    { line-height: 1.2 !important; }
        .spacing-15   { line-height: 1.6 !important; }
        .spacing-2    { line-height: 2.0 !important; }

        /* BUTTONS */
        .btn { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #222; border-color: #fff; }
        .btn-primary { background: #00F0FF11; border-color: #00F0FF; color: #00F0FF; }
        .btn-primary:hover { background: #00F0FF22; box-shadow: 0 0 15px #00F0FF44; }

        /* AUTH MODAL */
        #auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .auth-modal-content {
            background: #0a0a0a;
            border: 2px solid #00F0FF;
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
        }
        .auth-modal-header {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .auth-input:focus {
            outline: none;
            border-color: #00F0FF;
        }
        .auth-error {
            color: #FF0055;
            font-size: 12px;
            margin-bottom: 15px;
            min-height: 16px;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
        .auth-toggle a {
            color: #00F0FF;
            cursor: pointer;
            text-decoration: underline;
        }
        #auth-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00F0FF22;
            border: 2px solid #00F0FF;
            color: #00F0FF;
            padding: 15px 25px;
            border-radius: 6px;
            z-index: 2000;
            display: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        .auth-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .auth-box-title {
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .auth-box-email {
            font-size: 12px;
            color: #ddd;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .auth-box-status {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }
        .btn-small {
            padding: 8px;
            font-size: 12px;
        }

        /* REPLAY PANEL */
        #replay-panel {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 55vh;
            background: #050505;
            border-top: 2px solid #00F0FF;
            z-index: 500;
            flex-direction: column;
        }
        #replay-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            background: #00F0FF11;
            border-bottom: 1px solid #00F0FF33;
            flex-shrink: 0;
        }
        #replay-title {
            font-weight: bold;
            color: #00F0FF;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            letter-spacing: 1px;
        }
        #replay-time {
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        #replay-paste-indicator {
            display: none;
            background: #FFD70022;
            border: 1px solid #FFD700;
            color: #FFD700;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }
        #replay-blur-indicator {
            display: none;
            background: #FF005511;
            border: 1px solid #FF0055;
            color: #FF0055;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }
        #replay-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        #replay-scrubber {
            flex: 1;
            accent-color: #00F0FF;
            cursor: pointer;
        }
        #replay-play-btn {
            background: #00F0FF11;
            border: 1px solid #00F0FF;
            color: #00F0FF;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        #replay-play-btn:hover { background: #00F0FF22; }
        #replay-close-btn {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        #replay-editor {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
            background: #0a0a0a;
            color: #ddd;
            font-size: 15px;
            line-height: 1.6;
            border: 1px solid #222;
            margin: 10px 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .ledger-hash {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #00F0FF;
            letter-spacing: 1px;
            margin-top: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div style="margin-bottom:30px; display:flex; align-items:center; gap:10px;">
            <div style="font-size:24px;">⚡</div>
            <div>
                <div style="font-weight:800; color:#fff;">JITTER</div>
                <div style="font-size:10px; color:#666;">WRITER PRO</div>
            </div>
        </div>

        <div class="auth-box" id="auth-box">
            <div class="auth-box-title">Cloud Sync (Optional)</div>
            <div class="auth-box-email" id="auth-email">Not logged in</div>
            <div class="auth-box-status" id="sync-status">Login to sync passport</div>
            <button class="btn btn-small btn-primary" id="btn-login" style="margin-top:10px;">LOGIN</button>
            <button class="btn btn-small" id="btn-sync" style="display:none; margin-top:10px;">SYNC NOW</button>
            <button class="btn btn-small" id="btn-logout" style="display:none; margin-top:10px;">LOGOUT</button>
        </div>

        <div class="stat-box">
            <div class="label">Session Purity</div>
            <div class="value" id="purity-display" style="color: #00F0FF;">100%</div>
        </div>

        <div class="stat-box">
            <div class="label">Rhythm Entropy</div>
            <div class="value" id="entropy-display" style="color: #888;">100</div>
        </div>

        <div class="stat-box">
            <div class="label">Human Edits</div>
            <div class="value" id="edits-display" style="color: #FFD700;">0</div>
        </div>

        <div class="stat-box">
            <div class="label">Words</div>
            <div class="value" id="word-count">0</div>
        </div>

        <div class="stat-box" style="border-color:#FFD700;">
            <div class="label">Lifetime Passport</div>
            <div class="value" id="passport-display" style="color: #FFD700;">0</div>
            <div style="font-size:10px; color:#666; margin-top:5px;" id="passport-level">Novice</div>
        </div>

        <div class="stat-box" style="border-color:#00F0FF33;">
            <div class="label">Writing Ledger</div>
            <div class="value" id="ledger-count" style="color:#00F0FF; font-size:16px;">0 blocks</div>
            <div class="ledger-hash" id="ledger-hash">—</div>
        </div>

        <div style="margin-top:auto;">
            <button class="btn btn-primary" id="btn-export">MINT BADGE</button>
            <button class="btn" id="btn-replay" style="border-color:#00F0FF44; color:#00F0FF; background:#00F0FF08;">REPLAY</button>
            <button class="btn" id="btn-export-ledger" style="font-size:11px;">EXPORT LEDGER</button>
            <button class="btn" id="btn-reset">RESET</button>
        </div>
    </div>

    <div id="main">
        <div id="toolbar">
            <select class="tool-select" id="font-select">
                <option value="font-classic">Classic (Serif)</option>
                <option value="font-modern">Modern (Sans)</option>
                <option value="font-code">Code (Mono)</option>
            </select>
            <select class="tool-select" id="spacing-select">
                <option value="spacing-1">Single Space</option>
                <option value="spacing-15" selected>1.5 Space</option>
                <option value="spacing-2">Double Space</option>
            </select>
            <div style="width:1px; height:20px; background:#333; margin:0 5px;"></div>
            <button class="tool-btn" data-cmd="bold">B</button>
            <button class="tool-btn" data-cmd="italic">I</button>
            <button class="tool-btn" data-cmd="underline">U</button>
            <button class="tool-btn" data-cmd="formatBlock" data-val="H1">H1</button>
            <button class="tool-btn" data-cmd="formatBlock" data-val="H2">H2</button>
        </div>
        <div id="editor-container">
            <div id="editor" class="font-classic spacing-15" contenteditable="true" placeholder="Start typing..."></div>
        </div>
    </div>
    <!-- Auth Modal -->
    <div id="auth-modal">
        <div class="auth-modal-content">
            <div class="auth-modal-header">⚡ Login to JITTEr</div>
            <input type="email" class="auth-input" id="auth-email-input" placeholder="Email">
            <input type="password" class="auth-input" id="auth-password-input" placeholder="Password">
            <div class="auth-error" id="auth-error"></div>
            <button class="btn btn-primary" id="auth-submit-btn">
                <span id="auth-submit-text">LOGIN</span>
            </button>
            <div class="auth-toggle">
                <input type="checkbox" id="auth-mode-toggle">
                <label for="auth-mode-toggle">New user? Sign up instead</label>
            </div>
            <button class="btn" style="margin-top:20px;" id="auth-cancel-btn">CANCEL</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="auth-notification"></div>

    <!-- Writing Ledger Replay Panel -->
    <div id="replay-panel">
        <div id="replay-header">
            <span id="replay-title">⚡ WRITING LEDGER — REPLAY</span>
            <span id="replay-time">T+0:00</span>
            <span id="replay-paste-indicator">📋 PASTE EVENT</span>
            <span id="replay-blur-indicator"></span>
            <button id="replay-close-btn">✕ CLOSE</button>
        </div>
        <div id="replay-controls">
            <button id="replay-play-btn">▶ PLAY</button>
            <input type="range" id="replay-scrubber" min="0" max="0" value="0">
            <span style="color:#666; font-size:11px; font-family:monospace; white-space:nowrap;">
                DRAG TO SCRUB
            </span>
        </div>
        <div id="replay-editor"></div>
    </div>

    <!-- Firebase SDK -->

    <!-- Cloud sync (auth-utils.js) is not loaded: it needs the Firebase SDK, which MV3 blocks. -->
    <script src="src/crypto-utils.js"></script>
    <script src="src/passport-utils.js"></script>
    <script src="src/biometrics.js"></script>
    <script src="src/writer.js"></script>
    <script src="src/writer-page.js"></script>

</body>
</html>
