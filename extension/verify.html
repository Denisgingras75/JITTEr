<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitter Badge Verification | Teacher Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ddd;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #888;
            margin-top: 10px;
            font-size: 16px;
        }

        .input-section {
            background: #0f0f0f;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #badge-input {
            width: 100%;
            min-height: 120px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 6px;
            color: #ddd;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 15px;
            resize: vertical;
        }

        #badge-input:focus {
            outline: none;
            border-color: #00F0FF;
            box-shadow: 0 0 20px #00F0FF33;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #00F0FF11;
            border: 2px solid #00F0FF;
            color: #00F0FF;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            background: #00F0FF22;
            box-shadow: 0 0 25px #00F0FF44;
            transform: translateY(-2px);
        }

        #result {
            display: none;
        }

        .result-card {
            background: #0f0f0f;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #222;
        }

        .risk-badge {
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        .risk-low { background: #00F0FF22; color: #00F0FF; border: 2px solid #00F0FF; }
        .risk-medium { background: #FFD70022; color: #FFD700; border: 2px solid #FFD700; }
        .risk-high { background: #FF005522; color: #FF0055; border: 2px solid #FF0055; }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .metric {
            background: #111;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .metric-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .metric-status {
            font-size: 12px;
            margin-top: 5px;
        }

        .section-header {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 30px 0 15px 0;
            font-weight: bold;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .alert-box {
            background: #FF005511;
            border: 2px solid #FF0055;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
        }

        .alert-title {
            font-weight: bold;
            color: #FF0055;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .alert-item {
            color: #ddd;
            font-size: 13px;
            margin: 5px 0;
            padding-left: 15px;
            position: relative;
        }

        .alert-item:before {
            content: '⚠';
            position: absolute;
            left: 0;
        }

        .success-box {
            background: #00F0FF11;
            border: 2px solid #00F0FF;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            color: #00F0FF;
        }

        .chain-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #111;
            border-radius: 6px;
            margin-top: 15px;
        }

        .chain-icon {
            font-size: 24px;
        }

        .error-box {
            background: #FF005511;
            border: 2px solid #FF0055;
            border-radius: 6px;
            padding: 20px;
            color: #FF0055;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>⚡</span>
                <span>JITTER VERIFICATION</span>
            </h1>
            <p>Teacher Dashboard - Verify Student Badges</p>
        </div>

        <div class="input-section">
            <div class="input-label">Paste Badge Link or Code</div>
            <textarea id="badge-input" placeholder="Paste the ⚡ JITTER badge HTML, URL (#jitter:...), or Base64 code here..."></textarea>
            <div class="input-label" style="margin-top:14px;">Submitted Text (optional)</div>
            <textarea id="text-input" placeholder="Paste the submitted text to check it is what the badge was minted for..."></textarea>
            <button class="btn" id="verify-btn">VERIFY BADGE</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="src/crypto-utils.js"></script>
    <script src="src/passport-utils.js"></script>
    <script src="src/verify-page.js"></script>
</body>
</html>
