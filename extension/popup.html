<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JITTEr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      background: #0f0f10;
      color: #e5e5e5;
    }
    header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    header p { font-size: 12px; color: #8a8a8a; }
    section { padding: 14px 18px; border-bottom: 1px solid #1f1f1f; }
    section:last-of-type { border-bottom: none; }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8a8a8a;
      margin-bottom: 6px;
    }
    .origin {
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
      color: #fff;
      word-break: break-all;
      margin-bottom: 4px;
    }
    .state { color: #b5b5b5; margin-bottom: 10px; }
    .state.on { color: #4cd9c0; }
    .state.error { color: #ff7b7b; }
    .note { color: #8a8a8a; font-size: 12px; margin-top: 10px; }
    dl { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 4px; }
    dt { color: #8a8a8a; }
    dd { color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      background: #1a1a1b;
      color: #e5e5e5;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn + .btn { margin-top: 8px; }
    .btn:hover:not(:disabled) { background: #242425; border-color: #3d3d3d; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: #123c39; border-color: #1f6b63; color: #9df0dd; }
    .btn.primary:hover:not(:disabled) { background: #174a46; }
    .btn.quiet { background: transparent; color: #b5b5b5; font-weight: 500; }
    .result { margin-top: 10px; color: #b5b5b5; }
    .result.ok { color: #4cd9c0; }
    .result.error { color: #ff7b7b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>JITTEr</h1>
    <p>Process receipts for written work</p>
  </header>

  <section>
    <div class="label">This site</div>
    <div class="origin" id="site-origin">…</div>
    <div class="state" id="site-state">Checking…</div>
    <button class="btn primary" id="site-toggle" disabled>Enable on this site</button>
    <p class="note">JITTEr records typing rhythm only, never text, and only on sites you enable.</p>
  </section>

  <section>
    <div class="label">This device</div>
    <dl>
      <dt>First used</dt><dd id="pp-first">—</dd>
      <dt>Sessions</dt><dd id="pp-sessions">0</dd>
      <dt>Keystrokes</dt><dd id="pp-keys">0</dd>
    </dl>
  </section>

  <section>
    <button class="btn" id="open-writer">Open Writer</button>
    <button class="btn" id="open-verify">Verify a receipt</button>
  </section>

  <section>
    <button class="btn quiet" id="erase">Delete my server records</button>
    <div class="result" id="erase-result" hidden></div>
  </section>

  <script src="src/popup.js"></script>
</body>
</html>
