<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvil - Human Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 0;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stat-card.full {
      grid-column: 1 / -1;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-value.purity {
      font-size: 36px;
      background: linear-gradient(90deg, #fff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.1);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 600;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 24px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle.active {
      background: #4ade80;
    }

    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle.active .toggle-knob {
      transform: translateX(24px);
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .btn-primary {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .btn-primary:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.3);
      color: white;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.5);
    }

    .btn-danger.holding {
      background: rgba(239, 68, 68, 0.8);
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .btn-success {
      background: rgba(34, 197, 94, 0.3);
      color: white;
    }

    .btn-success:hover {
      background: rgba(34, 197, 94, 0.5);
    }

    .footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      text-align: center;
      font-size: 11px;
      opacity: 0.7;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #4ade80;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚒️ ANVIL</h1>
    <p>Human Verification System</p>
  </div>

  <div class="content">
    <div class="stats-grid">
      <div class="stat-card full">
        <div class="stat-label">Purity Score</div>
        <div class="stat-value purity" id="purity">100%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Human</div>
        <div class="stat-value" id="humanChars">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Alien</div>
        <div class="stat-value" id="alienChars">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Jitter (ms)</div>
        <div class="stat-value" id="jitter">0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Session Time</div>
        <div class="stat-value" id="sessionTime">0m</div>
      </div>
    </div>

    <div class="controls">
      <div class="toggle-row">
        <span class="toggle-label">
          <span class="status-indicator" id="statusIndicator"></span>
          Project Mode
        </span>
        <div class="toggle" id="projectToggle">
          <div class="toggle-knob"></div>
        </div>
      </div>

      <button class="btn btn-success" id="openWriterBtn">
        Open Writer
      </button>

      <button class="btn btn-primary" id="generateBadgeBtn">
        Generate Smart Badge
      </button>

      <button class="btn btn-danger" id="resetBtn">
        Hold to Reset (2s)
      </button>
    </div>
  </div>

  <div class="footer">
    Session started: <span id="sessionStart">--</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
