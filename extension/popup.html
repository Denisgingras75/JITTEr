<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jitter Protocol</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
    }
    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #262626;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header p { font-size: 12px; color: #737373; margin-top: 4px; }
    .content { padding: 20px; }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #171717;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #262626;
    }
    .stat-card.full { grid-column: 1 / -1; }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #737373;
      margin-bottom: 4px;
    }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-value.war { color: #00F0FF; }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #171717;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .user-info { font-size: 13px; }
    .user-email { color: #737373; font-size: 11px; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
      transition: all 0.15s;
    }
    .btn-primary { background: #00F0FF22; color: #00F0FF; border: 1px solid #00F0FF44; }
    .btn-primary:hover { background: #00F0FF33; }
    .btn-secondary { background: #171717; color: #a3a3a3; border: 1px solid #262626; }
    .btn-secondary:hover { background: #262626; }
    .btn-google { background: #1a1a1a; color: #fff; border: 1px solid #333; }
    .btn-google:hover { background: #262626; border-color: #00F0FF; color: #00F0FF; }
    .btn-signout { background: none; color: #525252; border: 1px solid #262626; font-size: 11px; padding: 6px 12px; width: auto; }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #262626;
      text-align: center;
      font-size: 11px;
      color: #525252;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ JITTER</h1>
    <p>Biometric Verification Protocol</p>
  </div>

  <div class="content">
    <!-- Auth state -->
    <div id="auth-logged-out">
      <button class="btn btn-google" id="sign-in-btn">Sign in with Google</button>
    </div>
    <div id="auth-logged-in" style="display:none;">
      <div class="user-bar">
        <div>
          <div class="user-info" id="user-display">Signed in</div>
          <div class="user-email" id="user-email"></div>
        </div>
        <button class="btn-signout" id="sign-out-btn">Sign out</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card full">
        <div class="stat-label">Passport Level</div>
        <div class="stat-value war" id="level">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Keys</div>
        <div class="stat-value" id="totalKeys">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sessions</div>
        <div class="stat-value" id="sessions">0</div>
      </div>
    </div>

    <button class="btn btn-primary" id="open-writer-btn">Open Writer</button>
    <button class="btn btn-secondary" id="open-verifier-btn">Verify Badge</button>
  </div>

  <div class="footer">
    We see HOW you type, never WHAT you type.
  </div>

  <script>
    // Load auth state
    chrome.runtime.sendMessage({ action: 'getUser' }, function(user) {
      if (user && user.loggedIn) {
        document.getElementById('auth-logged-in').style.display = 'block';
        document.getElementById('auth-logged-out').style.display = 'none';
        document.getElementById('user-display').textContent = user.email || 'Signed in';
        if (user.email) document.getElementById('user-email').textContent = user.user_id.slice(0, 8) + '...';
      } else {
        document.getElementById('auth-logged-out').style.display = 'block';
        document.getElementById('auth-logged-in').style.display = 'none';
      }
    });

    // Load passport stats
    chrome.storage.local.get('passport', function(data) {
      if (data.passport) {
        var p = data.passport;
        document.getElementById('level').textContent = p.level || 'Novice';
        var k = p.totalKeystrokes || 0;
        document.getElementById('totalKeys').textContent = k >= 1000 ? (k/1000).toFixed(1) + 'K' : k;
        document.getElementById('sessions').textContent = p.sessionsCompleted || 0;
      }
    });

    document.getElementById('sign-in-btn').addEventListener('click', function() {
      chrome.runtime.sendMessage({ action: 'signIn' }, function(res) {
        if (res && res.ok) window.close(); // reopen will show logged-in state
        else if (res && res.error) {
          document.getElementById('sign-in-btn').textContent = 'Auth failed — try again';
        }
      });
    });

    document.getElementById('sign-out-btn').addEventListener('click', function() {
      chrome.runtime.sendMessage({ action: 'signOut' }, function() { window.close(); });
    });

    document.getElementById('open-writer-btn').addEventListener('click', function() {
      chrome.runtime.sendMessage({ action: 'openWriter' });
      window.close();
    });

    document.getElementById('open-verifier-btn').addEventListener('click', function() {
      chrome.tabs.create({ url: chrome.runtime.getURL('verify.html') });
      window.close();
    });
  </script>
</body>
</html>
