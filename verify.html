<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitter Badge Verification | Teacher Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ddd;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #888;
            margin-top: 10px;
            font-size: 16px;
        }

        .input-section {
            background: #0f0f0f;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #badge-input {
            width: 100%;
            min-height: 120px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 6px;
            color: #ddd;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 15px;
            resize: vertical;
        }

        #badge-input:focus {
            outline: none;
            border-color: #00F0FF;
            box-shadow: 0 0 20px #00F0FF33;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #00F0FF11;
            border: 2px solid #00F0FF;
            color: #00F0FF;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            background: #00F0FF22;
            box-shadow: 0 0 25px #00F0FF44;
            transform: translateY(-2px);
        }

        #result {
            display: none;
        }

        .result-card {
            background: #0f0f0f;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #222;
        }

        .risk-badge {
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        .risk-low { background: #00F0FF22; color: #00F0FF; border: 2px solid #00F0FF; }
        .risk-medium { background: #FFD70022; color: #FFD700; border: 2px solid #FFD700; }
        .risk-high { background: #FF005522; color: #FF0055; border: 2px solid #FF0055; }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .metric {
            background: #111;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .metric-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .metric-status {
            font-size: 12px;
            margin-top: 5px;
        }

        .section-header {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 30px 0 15px 0;
            font-weight: bold;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .alert-box {
            background: #FF005511;
            border: 2px solid #FF0055;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
        }

        .alert-title {
            font-weight: bold;
            color: #FF0055;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .alert-item {
            color: #ddd;
            font-size: 13px;
            margin: 5px 0;
            padding-left: 15px;
            position: relative;
        }

        .alert-item:before {
            content: '⚠';
            position: absolute;
            left: 0;
        }

        .success-box {
            background: #00F0FF11;
            border: 2px solid #00F0FF;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            color: #00F0FF;
        }

        .chain-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #111;
            border-radius: 6px;
            margin-top: 15px;
        }

        .chain-icon {
            font-size: 24px;
        }

        .error-box {
            background: #FF005511;
            border: 2px solid #FF0055;
            border-radius: 6px;
            padding: 20px;
            color: #FF0055;
            text-align: center;
        }

        /* Baseball Card Styles */
        .baseball-card {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a0a 100%);
            border: 2px solid #FFD700;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .baseball-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle at top right, #FFD70011 0%, transparent 70%);
        }
        .war-hero {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .war-number {
            font-size: 56px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }
        .war-details {
            flex: 1;
        }
        .war-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .war-tier-text {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }
        .stat-grid-compact {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-cell {
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
        }
        .stat-cell-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-cell-value {
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        .stat-cell-sub {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }
        .section-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0 15px 0;
        }
        .section-divider-line {
            flex: 1;
            height: 1px;
            background: #333;
        }
        .section-divider-text {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .consistency-bar {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .consistency-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .digraph-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .digraph-chip {
            background: #111;
            border: 1px solid #222;
            border-radius: 3px;
            padding: 4px 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        .digraph-pair {
            color: #00F0FF;
            font-weight: bold;
        }
        .digraph-time {
            color: #888;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>⚡</span>
                <span>JITTER VERIFICATION</span>
            </h1>
            <p>Teacher Dashboard - Baseball Card Stats & Badge Verification</p>
        </div>

        <div class="input-section">
            <div class="input-label">Paste Badge Link or Code</div>
            <textarea id="badge-input" placeholder="Paste the ⚡ JITTER badge HTML, URL (#jitter:...), or Base64 code here..."></textarea>
            <button class="btn" onclick="verifyBadge()">VERIFY BADGE</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="crypto-utils.js"></script>
    <script src="passport-utils.js"></script>
    <script>
        function extractBadgeData(input) {
            input = input.trim();

            // Try to extract from HTML
            const htmlMatch = input.match(/data-jitter-payload="([^"]+)"/);
            if (htmlMatch) return htmlMatch[1];

            // Try to extract from URL
            const urlMatch = input.match(/#jitter:([A-Za-z0-9+/=]+)/);
            if (urlMatch) return urlMatch[1];

            // Assume it's raw base64
            return input;
        }

        function getRiskClass(score) {
            if (score >= 70) return 'risk-high';
            if (score >= 40) return 'risk-medium';
            return 'risk-low';
        }

        function getRiskEmoji(score) {
            if (score >= 70) return '🚨';
            if (score >= 40) return '⚠️';
            return '✅';
        }

        function getRiskText(score) {
            if (score >= 70) return 'HIGH RISK';
            if (score >= 40) return 'MEDIUM RISK';
            return 'LOW RISK';
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        async function verifyBadge() {
            const input = document.getElementById('badge-input').value;
            const resultDiv = document.getElementById('result');

            if (!input) {
                resultDiv.innerHTML = '<div class="error-box">Please paste a badge first.</div>';
                resultDiv.style.display = 'block';
                return;
            }

            try {
                const base64 = extractBadgeData(input);
                const jsonString = atob(base64);
                const data = JSON.parse(jsonString);

                // --- CRYPTOGRAPHIC VERIFICATION ---
                // The signature was computed over the payload WITHOUT the signature field.
                // Strip signature to reconstruct what was originally signed.
                let cryptoStatus = 'unsigned'; // 'unsigned' | 'valid' | 'invalid'
                if (data.signature && data.publicKeyJwk) {
                    const { signature, ...payloadWithoutSignature } = data;
                    try {
                        const isValid = await CryptoUtils.verifyBadge(
                            payloadWithoutSignature,
                            signature,
                            data.publicKeyJwk
                        );
                        cryptoStatus = isValid ? 'valid' : 'invalid';
                    } catch (e) {
                        cryptoStatus = 'invalid';
                    }
                }

                const suspicionScore = data.suspicionScore || 0;
                const riskClass = getRiskClass(suspicionScore);
                const riskEmoji = getRiskEmoji(suspicionScore);
                const riskText = getRiskText(suspicionScore);

                // Build crypto status banner
                const cryptoBanner = cryptoStatus === 'valid'
                    ? `<div style="background:#00F0FF11;border:2px solid #00F0FF;border-radius:6px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;"><span style="font-size:20px;">🔐</span><div><div style="font-weight:bold;color:#00F0FF;">SIGNATURE VALID — Cryptographically Verified</div><div style="font-size:12px;color:#888;margin-top:2px;">ECDSA P-256 · Key ID: ${data.publicKeyId || '—'}</div></div></div>`
                    : cryptoStatus === 'invalid'
                    ? `<div style="background:#FF005511;border:2px solid #FF0055;border-radius:6px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;"><span style="font-size:20px;">🚨</span><div><div style="font-weight:bold;color:#FF0055;">SIGNATURE INVALID — Badge may be forged</div><div style="font-size:12px;color:#888;margin-top:2px;">The cryptographic signature does not match the payload.</div></div></div>`
                    : `<div style="background:#FFD70011;border:2px solid #FFD700;border-radius:6px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;"><span style="font-size:20px;">⚠️</span><div><div style="font-weight:bold;color:#FFD700;">UNSIGNED BADGE — No cryptographic proof</div><div style="font-size:12px;color:#888;margin-top:2px;">Data is readable but authenticity cannot be confirmed.</div></div></div>`;

                const headerTitle = cryptoStatus === 'valid' ? 'Badge Verified' : cryptoStatus === 'invalid' ? 'Badge Invalid' : 'Badge Decoded (Unsigned)';

                // WAR tier calculation
                const war = data.war || 0;
                let warColor = '#FF0055', warTier = 'Suspicious', warIcon = '🚩';
                if (war >= 8.0) { warColor = '#FFD700'; warTier = 'Hall of Fame'; warIcon = '⭐'; }
                else if (war >= 6.0) { warColor = '#00F0FF'; warTier = 'All-Star'; warIcon = '✅'; }
                else if (war >= 4.0) { warColor = '#4488FF'; warTier = 'Solid'; warIcon = '🔷'; }
                else if (war >= 2.0) { warColor = '#FFD700'; warTier = 'Rookie'; warIcon = '⚠️'; }

                // Account age formatting
                const ageDays = data.accountAge || 0;
                let ageDisplay = ageDays + ' days';
                if (ageDays >= 365) ageDisplay = (ageDays / 365).toFixed(1) + ' yrs';
                else if (ageDays >= 30) ageDisplay = Math.floor(ageDays / 30) + ' mo';

                let html = `
                    <!-- BASEBALL CARD: WAR Hero Section -->
                    <div class="baseball-card">
                        <div class="war-hero">
                            <div>
                                <div class="war-number" style="color:${warColor}">${war > 0 ? war.toFixed(1) : '—'}</div>
                                <div class="war-label">WAR</div>
                            </div>
                            <div class="war-details">
                                <div class="war-tier-text" style="color:${warColor}">${warIcon} ${warTier}</div>
                                <div style="font-size:12px; color:#888; margin-top:4px;">Writer Authenticity Rating</div>
                            </div>
                            <div class="risk-badge ${riskClass}" style="margin-left:auto;">
                                ${riskEmoji} ${riskText}
                            </div>
                        </div>
                        ${cryptoBanner}

                        <!-- Career Overview Grid -->
                        <div class="stat-grid-compact">
                            <div class="stat-cell">
                                <div class="stat-cell-label">Career Keys</div>
                                <div class="stat-cell-value" style="color:#FFD700">${formatNumber(data.passport || 0)}</div>
                                <div class="stat-cell-sub">${data.passportLevel || 'Novice'}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Account Age</div>
                                <div class="stat-cell-value" style="color:${ageDays >= 30 ? '#00F0FF' : '#FFD700'}">${ageDisplay}</div>
                                <div class="stat-cell-sub">${ageDays >= 30 ? 'Established' : 'New'}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Sessions</div>
                                <div class="stat-cell-value">${data.sessions || 0}</div>
                                <div class="stat-cell-sub">completed</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Career Purity</div>
                                <div class="stat-cell-value" style="color:${(data.careerPurity || 0) >= 0.9 ? '#00F0FF' : '#FFD700'}">.${String(Math.round((data.careerPurity || 0) * 1000)).padStart(3, '0')}</div>
                                <div class="stat-cell-sub">lifetime</div>
                            </div>
                        </div>

                        <!-- Career Stats Row 2 -->
                        <div class="stat-grid-compact">
                            <div class="stat-cell">
                                <div class="stat-cell-label">Career WPM</div>
                                <div class="stat-cell-value">${data.careerWpm || '—'}</div>
                                <div class="stat-cell-sub">avg speed</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Career CR</div>
                                <div class="stat-cell-value" style="color:${(data.careerCR || 0) >= 1.5 ? '#00F0FF' : '#FFD700'}">${data.careerCR || '—'}</div>
                                <div class="stat-cell-sub">cog. ratio</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Streak</div>
                                <div class="stat-cell-value">${data.streak || 0}d</div>
                                <div class="stat-cell-sub">best: ${data.longestStreak || 0}d</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Error Rate</div>
                                <div class="stat-cell-value">${data.careerErrorRate || '—'}</div>
                                <div class="stat-cell-sub">per 100 keys</div>
                            </div>
                        </div>

                        <!-- Consistency Checks -->
                        <div class="section-divider">
                            <div class="section-divider-line"></div>
                            <div class="section-divider-text">Consistency Check</div>
                            <div class="section-divider-line"></div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                            <div>
                                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                                    <span style="color:#888">Rhythm Signature</span>
                                    <span style="color:${(data.rhythmSignature || 0) >= 70 ? '#00F0FF' : '#FFD700'}">${data.rhythmSignature || 0}%</span>
                                </div>
                                <div class="consistency-bar">
                                    <div class="consistency-fill" style="width:${data.rhythmSignature || 0}%; background:${(data.rhythmSignature || 0) >= 70 ? '#00F0FF' : '#FFD700'}"></div>
                                </div>
                            </div>
                            <div>
                                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                                    <span style="color:#888">Consistency Index</span>
                                    <span style="color:${(data.consistencyIndex || 0) >= 60 ? '#00F0FF' : '#FFD700'}">${data.consistencyIndex || 0}%</span>
                                </div>
                                <div class="consistency-bar">
                                    <div class="consistency-fill" style="width:${data.consistencyIndex || 0}%; background:${(data.consistencyIndex || 0) >= 60 ? '#00F0FF' : '#FFD700'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SESSION BOX SCORE -->
                    <div class="result-card">
                        <div class="result-header">
                            <h2 style="margin:0; color:#fff;">Session Box Score</h2>
                            <span style="color:#888; font-size:13px;">${data.date || 'Unknown'}</span>
                        </div>

                        <div class="stat-grid-compact">
                            <div class="stat-cell">
                                <div class="stat-cell-label">Purity</div>
                                <div class="stat-cell-value" style="color:${(data.sessionPurity || data.purity/100) >= 0.9 ? '#00F0FF' : '#FF0055'}">.${String(Math.round((data.sessionPurity || data.purity/100) * 1000)).padStart(3, '0')}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Cog. Ratio</div>
                                <div class="stat-cell-value" style="color:${(data.sessionCR || data.cr) >= 1.5 ? '#00F0FF' : '#FFD700'}">${data.sessionCR || data.cr}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Entropy</div>
                                <div class="stat-cell-value">${data.sessionEntropy || data.entropy || 0}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">WPM</div>
                                <div class="stat-cell-value">${data.sessionWpm || '—'}</div>
                            </div>
                        </div>

                        <div class="stat-grid-compact">
                            <div class="stat-cell">
                                <div class="stat-cell-label">Edit Rate</div>
                                <div class="stat-cell-value">${data.editRate !== undefined ? (data.editRate * 100).toFixed(1) + '%' : '—'}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Focus Time</div>
                                <div class="stat-cell-value" style="color:${(data.focusTime || 0) >= 0.5 ? '#00F0FF' : '#FFD700'}">${data.focusTime !== undefined ? Math.round(data.focusTime * 100) + '%' : '—'}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Paste Events</div>
                                <div class="stat-cell-value" style="color:${(data.pasteEvents || 0) === 0 ? '#00F0FF' : '#FF0055'}">${data.pasteEvents || 0}</div>
                            </div>
                            <div class="stat-cell">
                                <div class="stat-cell-label">Burst Rate</div>
                                <div class="stat-cell-value">${data.burstRate || '—'}</div>
                            </div>
                        </div>

                        <!-- Advanced Metrics -->
                        <div class="section-divider">
                            <div class="section-divider-line"></div>
                            <div class="section-divider-text">Advanced Metrics</div>
                            <div class="section-divider-line"></div>
                        </div>

                        <div class="info-row">
                            <span class="info-label">Session Keystrokes</span>
                            <span class="info-value">${formatNumber(data.keys || 0)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Active Time</span>
                            <span class="info-value">${data.activeMinutes || '—'} min / ${data.totalMinutes || '—'} min total</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Peak WPM</span>
                            <span class="info-value">${data.peakWpm || '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Dwell Signature</span>
                            <span class="info-value">${data.dwellMean ? data.dwellMean + 'ms (±' + data.dwellStdDev + 'ms)' : '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Correction Speed</span>
                            <span class="info-value">${data.correctionSpeed ? data.correctionSpeed + 'ms' : '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Flow State Index</span>
                            <span class="info-value">${data.flowStateIndex || '—'} keystrokes</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Error Rate</span>
                            <span class="info-value">${data.errorRate !== undefined ? data.errorRate + ' per 100 keys' : '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Warm-Up Curve</span>
                            <span class="info-value">${data.warmUpCurve ? data.warmUpCurve + 'x' : '—'}</span>
                        </div>
                        ${data.pasteVolume !== undefined ? `<div class="info-row">
                            <span class="info-label">Paste Volume</span>
                            <span class="info-value" style="color:${data.pasteVolume > 0.2 ? '#FF0055' : '#00F0FF'}">${(data.pasteVolume * 100).toFixed(1)}%</span>
                        </div>` : ''}

                        ${data.digraphDNA && Object.keys(data.digraphDNA).length > 0 ? `
                        <div class="section-divider">
                            <div class="section-divider-line"></div>
                            <div class="section-divider-text">Digraph DNA</div>
                            <div class="section-divider-line"></div>
                        </div>
                        <div class="digraph-grid">
                            ${Object.entries(data.digraphDNA).map(([pair, ms]) =>
                                `<div class="digraph-chip"><span class="digraph-pair">${pair}</span><span class="digraph-time">${ms}ms</span></div>`
                            ).join('')}
                        </div>
                        ` : ''}
                    </div>

                    <!-- PASSPORT PROFILE (Legacy section) -->
                    <div class="result-card">
                        <div class="section-header">PASSPORT PROFILE</div>
                        <div class="info-row">
                            <span class="info-label">Lifetime Keystrokes</span>
                            <span class="info-value">${formatNumber(data.passport || 0)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Level</span>
                            <span class="info-value">${data.passportLevel || 'Unknown'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Sessions Completed</span>
                            <span class="info-value">${data.sessions || 0}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Avg Daily Output</span>
                            <span class="info-value">${formatNumber(data.avgDailyKeys || 0)} keys/day</span>
                        </div>
`;

                // Show chain link if present
                if (data.previousBadge) {
                    html += `
                        <div class="section-header">BADGE CHAIN</div>
                        <div class="chain-indicator">
                            <span class="chain-icon">⛓️</span>
                            <div>
                                <div style="font-weight:bold; color:#00F0FF;">Linked to Previous Badge</div>
                                <div style="font-size:12px; color:#888; margin-top:3px;">
                                    Previous hash: ${data.previousBadge}
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Show warnings if high risk
                if (suspicionScore >= 40) {
                    html += `
                        <div class="alert-box">
                            <div class="alert-title">⚠️ SUSPICIOUS PATTERNS DETECTED</div>
                            ${data.avgDailyKeys > 3000 ? '<div class="alert-item">High daily output (' + formatNumber(data.avgDailyKeys) + ' keys/day)</div>' : ''}
                            ${data.accountAge < 7 && data.passport > 5000 ? '<div class="alert-item">New account with suspiciously high output</div>' : ''}
                            ${(data.cr || data.sessionCR) < 1.5 ? '<div class="alert-item">Low cognitive ratio (bot-like typing)</div>' : ''}
                            ${data.integrity < 80 ? '<div class="alert-item">High paste percentage</div>' : ''}
                            ${(data.errorRate || 0) < 0.5 && (data.keys || 0) > 500 ? '<div class="alert-item">Suspiciously low error rate</div>' : ''}
                            ${(data.rhythmSignature || 0) < 30 && (data.sessions || 0) > 5 ? '<div class="alert-item">Rhythm does not match career profile</div>' : ''}
                            <div style="margin-top:10px; font-size:12px; color:#ddd;">
                                Recommendation: Review this submission manually
                            </div>
                        </div>
                    `;
                } else if (suspicionScore < 20 && cryptoStatus === 'valid') {
                    html += `
                        <div class="success-box">
                            ✅ Signature verified + all metrics within normal human ranges. High confidence in authenticity.
                        </div>
                    `;
                } else if (suspicionScore < 20 && cryptoStatus === 'unsigned') {
                    html += `
                        <div class="success-box" style="background:#FFD70011;border-color:#FFD700;color:#FFD700;">
                            ⚠️ Metrics look human, but no cryptographic proof. Ask student to re-submit using Jitter v3.0.
                        </div>
                    `;
                }

                html += `</div>`;

                resultDiv.innerHTML = html;
                resultDiv.style.display = 'block';

            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error-box">
                        <h3 style="margin-top:0;">❌ Invalid Badge</h3>
                        <p>Could not decode badge data. Please check the input and try again.</p>
                        <p style="font-size:12px; margin-top:10px; color:#888;">Error: ${error.message}</p>
                    </div>
                `;
                resultDiv.style.display = 'block';
            }
        }

        // Allow Enter key to verify
        document.getElementById('badge-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                verifyBadge();
            }
        });
    </script>
</body>
</html>
